name: Life & Annuity Intelligence

on:
  schedule:
    # Noon Central (17:00 UTC), weekdays
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

jobs:
  run_digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------
      # NAIC LATF document cache
      # Persists resolved document dates so we don't re-fetch PDF
      # headers and HTTP metadata on every run.
      # ---------------------------------------------------------------
      - name: Restore NAIC LATF cache
        uses: actions/cache@v4
        with:
          path: naic_latf_cache.json
          key: naic-latf-cache-${{ github.run_id }}
          restore-keys: |
            naic-latf-cache-

      # ---------------------------------------------------------------
      # Seen-articles cache
      # Guarantees each article appears in the digest exactly once
      # across all runs (rolling 30-day window).
      # ---------------------------------------------------------------
      - name: Restore seen-articles cache
        uses: actions/cache@v4
        with:
          path: seen_articles_cache.json
          key: seen-articles-cache-${{ github.run_id }}
          restore-keys: |
            seen-articles-cache-

      - name: Run digest
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python digest.py

      - name: Save NAIC LATF cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: naic_latf_cache.json
          key: naic-latf-cache-${{ github.run_id }}

      - name: Save seen-articles cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_articles_cache.json
          key: seen-articles-cache-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          subject: "⚠️ Actuarial Intelligence digest FAILED"
          body: "The daily digest workflow failed. Check GitHub Actions logs."
          # Key rotates weekly so stale cache doesn't persist too long.
          # Restore-keys allow fallback to any recent cache.
          key: naic-latf-cache-${{ github.run_id }}
          restore-keys: |
            naic-latf-cache-

      - name: Run digest
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python digest.py

      # Save the updated cache after the run.
      # actions/cache saves automatically when the restore key matched,
      # but we explicitly save here to ensure new documents are cached
      # even on the first run (no prior cache).
      - name: Save NAIC LATF cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: naic_latf_cache.json
          key: naic-latf-cache-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          subject: "⚠️ Actuarial Intelligence digest FAILED"
          body: "The daily digest workflow failed. Check GitHub Actions logs."
