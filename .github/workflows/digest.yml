name: Life & Annuity Intelligence

on:
  schedule:
    # Noon Central (17:00 UTC), weekdays
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

jobs:
  run_digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Persists resolved document dates so we don't re-fetch PDF
      # headers and HTTP metadata on every run.
      - name: Restore NAIC LATF cache
        uses: actions/cache@v4
        with:
          path: naic_latf_cache.json
          key: naic-latf-cache-${{ github.run_id }}
          restore-keys: |
            naic-latf-cache-

      - name: Run digest
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python digest.py

      - name: Save NAIC LATF cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: naic_latf_cache.json
          key: naic-latf-cache-${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USER }}
          to: ${{ secrets.GMAIL_USER }}
          subject: "⚠️ Actuarial Intelligence digest FAILED"
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
      
            Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
